<!DOCTYPE html>
<html>

<head>
  <title>Challenge 8</title>
  <link rel="stylesheet" href="challenge8.css">
</head>

<body>
  <input class="block-input" type="text" placeholder="Name">
  <input class="block-input" type="text" placeholder="Email">

  <hr>

  <p class="question">Thanks for chatting with our customer support. Would you like to take our quick survery?</p>
  <button style="vertical-align: middle;">Yes</button>
  <button style="vertical-align: middle;">No</button>

  <hr>
  <div class="google-page">
    <div>
      <img class="google-logo" src="images/google-logo.webp">
    </div>
    <div>
      <input class="searchbar" type="text" placeholder="Search Google or type a URL"></input>
    </div>
    <div style="text-align: center;">
      <button class="google-button">Google Search</button>
      <button class="google-button">I'm Feeling Lucky</button>
    </div>

  </div>


  <hr>
  <input class="name-input" placeholder="First name">
  <input class="name-input" placeholder="Last name">
  <input class="mail-input" style="display: block;" placeholder="Email">
  <button class="sign-button">Sign Up</button>

  <hr>
  <p style="font-size: 25px; font-family: Arial;">Request a ride now</p>
  <input class="uber-input" placeholder="Enter pickup location">
  <input class="uber-input" placeholder="Enter destination">
  <button class="request-button">Request now</button>
  <button class="schedule-button">Schedule for later</button>


</body>

</html>
